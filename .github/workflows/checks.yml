name: Setup helper checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows PowerShell checks
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check syntax and isolated behavior
        shell: powershell
        run: ./tests-windows.ps1

  mac:
    name: macOS Bash checks
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check syntax and isolated behavior
        run: /bin/bash tests-mac.sh
